<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}- Denis Bogucanin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <style>
        /* GLASS EFFECT */
        .custom-navbar {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
        }

        /* LOGO */
        .navbar-brand {
            font-weight: bold;
            font-size: 22px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .navbar-brand:hover {
            color: #00d4ff !important;
        }

        /* LINKOVI */
        .nav-link {
            position: relative;
            margin-left: 15px;
            transition: 0.3s;
        }

        /* HOVER ANIMACIJA */
        .nav-link::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 2px;
            background: #00d4ff;
            left: 0;
            bottom: 0;
            transition: 0.3s;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* ACTIVE LINK */
        .active-link {
            color: #00d4ff !important;
        }

        .active-link::after {
            width: 100%;
        }

        /* TOGGLER */
        .navbar-toggler {
            border: none;
        }

        .navbar-toggler:focus {
            outline: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <a class="navbar-brand" href="/">
            Denis Bogucanin
        </a>
        <button class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbar">
            <div class="navbar-nav ml-auto">
                <a class="nav-item nav-link {% if request.path == '/' %}active-link{% endif %}" href="/">Home</a>
                <a class="nav-item nav-link {% if request.path == '/about_me' %}active-link{% endif %}" href="/about_me">About</a>
                <a class="nav-item nav-link {% if request.path == '/portfolio' %}active-link{% endif %}" href="/portfolio">Portfolio</a>
                <a class="nav-item nav-link {% if request.path == '/blog' %}active-link{% endif %}" href="/blog">Blog</a>
                <a class="nav-item nav-link {% if request.path == '/contact' %}active-link{% endif %}" href="/contact">Contact</a>
                <a class="nav-item nav-link" href="/login">Login</a>
                <a class="nav-item nav-link" href="/logout">Logout</a>
                <a class="nav-item nav-link" href="/sign_up">Sign Up</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %} {% endblock %}
    </div>
    <script type="text/javascript" src="{{ url_for('static', filename='index.js') }}"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
{% block javascript %}
    <script type="text/javascript">
      function deleteNote(noteId) {
          fetch("/delete-note", {
            method: "POST",
            body: JSON.stringify({ noteId: noteId }),
          }).then((_res) => {
            window.location.href = "/";
          });
      }
    </script>
{% endblock %}
</body>
</html>
